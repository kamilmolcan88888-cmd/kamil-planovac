# Downloads USDA FoodData Central CSVs and regenerates mealmath/data/foods.json.
# Runs when the food list or the build script changes, or manually.
name: MealMath – build foods.json from USDA

on:
  workflow_dispatch:
  push:
    paths:
      - 'mealmath/scripts/food-list.txt'
      - 'mealmath/scripts/build-foods.ts'
      - 'mealmath/scripts/match.ts'

permissions:
  contents: write

concurrency:
  group: mealmath-foods-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mealmath
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mealmath/package-lock.json
      - run: npm ci
      - name: Build foods.json
        id: build
        run: |
          set +e
          npm run build:foods 2>&1 | tee build.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Commit result (report is committed even on failure so it can be reviewed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          for f in data/foods-report.md data/foods.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: regenerate foods.json from USDA FoodData Central"
          git push
      - name: Fail if the build failed
        if: steps.build.outputs.code != '0'
        run: tail -60 build.log && exit 1
