# Tests, type check and production build for MealMath on every change.
name: MealMath – CI

on:
  push:
    paths: ['mealmath/**', '.github/workflows/mealmath-ci.yml']
  pull_request:
    paths: ['mealmath/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mealmath
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mealmath/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
