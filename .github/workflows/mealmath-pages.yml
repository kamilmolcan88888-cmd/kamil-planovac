# Free hosting on GitHub Pages: https://<user>.github.io/<repo>/mealmath/
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: MealMath – deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['mealmath/**', 'index.html', 'manifest.webmanifest', 'sw.js', '.github/workflows/mealmath-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mealmath-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mealmath
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mealmath/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # MealMath lives under /mealmath/ so it never collides with the older app (and its
      # service worker) published at the site root. The root files are kept as they are.
      - name: Assemble site
        working-directory: .
        run: |
          mkdir -p _site
          for f in index.html manifest.webmanifest sw.js; do [ -f "$f" ] && cp "$f" _site/; done
          cp -r mealmath/dist _site/mealmath
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
